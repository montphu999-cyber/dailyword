<meta name="theme-color" content="#f59e0b">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#1e293b;border-radius:20px;padding:24px;max-width:420px;width:100%;border:1px solid #334155;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{font-size:28px;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:#94a3b8;margin-bottom:20px;font-size:14px}
.word-box{background:#0f172a;border-radius:16px;padding:20px;text-align:center;margin:16px 0;border:1px solid #334155}
.word{font-size:36px;font-weight:800;color:#f59e0b}
.mean{font-size:18px;margin-top:8px;color:#e2e8f0}
.example{margin-top:12px;font-size:14px;color:#94a3b8;font-style:italic}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;margin-top:12px}
.btn-gold{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000}
.btn-dark{background:#334155;color:#fff}
.badge{display:inline-block;background:#f59e0b;color:#000;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:12px}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="card">
<div style="text-align:center"><span class="badge">DW • พร้อมติดตั้งปุ่มเดียว</span></div>
<h1>Daily Word</h1>
<p class="sub">คำศัพท์อังกฤษวันละคำ - ติดตั้งลงหน้าจอได้เลย</p>
<div class="word-box">
<div class="word" id="word">Serendipity</div>
<div class="mean" id="mean">ความบังเอิญที่โชคดี</div>
<div class="example" id="example">"Finding this app was pure serendipity!"</div>
</div>
<button class="btn btn-gold" id="installBtn">📲 ติดตั้งแอปลงหน้าจอ (ปุ่มเดียว)</button>
<button class="btn btn-dark" onclick="nextWord()">🔄 คำต่อไป</button>
<p style="text-align:center;margin-top:16px;font-size:12px;color:#64748b" id="status">พร้อมติดตั้ง • ฟรีตลอดชีพบน GitHub Pages</p>
</div>
<script>
const words=[
{en:"Serendipity",th:"ความบังเอิญที่โชคดี",ex:"Finding this app was pure serendipity!"},
{en:"Ephemeral",th:"อยู่เพียงชั่วคราว",ex:"Fame in social media is ephemeral."},
{en:"Resilience",th:"ความยืดหยุ่น ฟื้นตัวได้",ex:"Resilience is key to success."},
{en:"Mellifluous",th:"ไพเราะหวานหู",ex:"Her mellifluous voice calmed me."},
{en:"Ubiquitous",th:"มีอยู่ทุกที่",ex:"Smartphones are now ubiquitous."},
{en:"Eloquent",th:"พูดจาฉะฉาน",ex:"He gave an eloquent speech."},
{en:"Gratitude",th:"ความกตัญญู ขอบคุณ",ex:"Show gratitude every day."}
];
let idx=0;
function nextWord(){idx=(idx+1)%words.length;document.getElementById('word').textContent=words[idx].en;document.getElementById('mean').textContent=words[idx].th;document.getElementById('example').textContent='"'+words[idx].ex+'"';}
let deferredPrompt=null;
const installBtn=document.getElementById('installBtn');
const statusEl=document.getElementById('status');
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;installBtn.textContent='📲 ติดตั้งแอปเลย - กดตรงนี้!';installBtn.style.animation='pulse 1s infinite';statusEl.textContent='✅ พร้อมติดตั้งแบบปุ่มเดียวแล้ว!';});
installBtn.addEventListener('click',async()=>{
if(deferredPrompt){deferredPrompt.prompt();const c=await deferredPrompt.userChoice;if(c.outcome==='accepted'){statusEl.textContent='🎉 ติดตั้งสำเร็จ! ดูที่หน้าจอโฮม';}deferredPrompt=null;}
else if(/iPhone|iPad|iPod/.test(navigator.userAgent)){alert('บน iPhone: กดปุ่ม แชร์ (สี่เหลี่ยมมีลูกศร) ด้านล่าง → เลื่อนลงกด "เพิ่มไปยังหน้าจอโฮม" → กด เพิ่ม');}
else{alert('กดเมนู ⋮ มุมขวาบนของ Chrome → กด "ติดตั้งแอป" หรือ "Add to Home screen"');}
});
if('serviceWorker' in navigator){
const swCode="self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))));";
const blob=new Blob([swCode],{type:'text/javascript'});
const swUrl=URL.createObjectURL(blob);
navigator.serviceWorker.register(swUrl);
}
</script>
</body>
</html>
